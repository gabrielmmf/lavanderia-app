name: Cron de notificações

# DESATIVADO EM 19/08/2026 — cota de compute do Neon.
#
# O que este workflow fazia: era a rede de segurança do envio de notificações,
# não o agendador principal. O cron da Vercel no plano Hobby só dispara uma vez
# por dia, inútil para um aviso de "faltam 15 minutos", então o agendamento veio
# parar aqui — e como o `schedule` do GitHub também não é pontual (apesar do
# `*/5`, este repositório recebia uma execução a cada 1 a 3 horas), a
# pontualidade ficava por conta de um job externo no cron-job.org.
#
# Por que está desligado: o plano free do Neon dá 100 CU-horas por projeto por
# mês e mantém o autosuspend fixo em 5 minutos. Um cron de 5 em 5 minutos acorda
# o banco exatamente no ritmo em que ele tentaria dormir — 0,25 CU ligado 24
# horas por dia, ~5,9 CU-horas por dia, a cota do mês queimada no dia 19 e o app
# fora do ar com erro `53000`. Mesmo espaçado em horas pelo GitHub, este
# `schedule` sozinho manteria o banco acordado boa parte do dia.
#
# O `workflow_dispatch` fica de propósito: dá para testar o endpoint à mão sem
# religar o agendamento. Com `NOTIFICATIONS_ENABLED` desligado ele responde 200
# sem consultar o banco.
#
# Para religar, os quatro passos têm que acontecer juntos — ver
# `src/lib/notifications-config.ts` e `docs/DEPLOY.md`.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-notifications
  cancel-in-progress: false

jobs:
  notify:
    name: Disparar ciclo de notificações
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure a variável PRODUCTION_URL e o secret CRON_SECRET."
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/cron/notifications")

          echo "$response"
          echo "$response" >> "$GITHUB_STEP_SUMMARY"
