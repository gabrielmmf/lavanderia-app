name: Cron de notificações

# REDE DE SEGURANÇA, não o agendador principal.
#
# O plano Hobby da Vercel só permite cron uma vez por dia, o que é inútil para
# um aviso de "faltam 15 minutos" — daí o agendador ter vindo parar aqui. Só que
# o `schedule` do GitHub também não serve sozinho: apesar do `*/5`, este
# repositório recebia uma execução a cada 1 a 3 horas (agosto de 2026). O GitHub
# desprioriza `schedule` em repositórios de pouco tráfego e não há configuração
# que resolva.
#
# A pontualidade vem de um agendador externo (cron-job.org) chamando o mesmo
# endpoint a cada 5 minutos. Este workflow fica como garantia de que nada
# congela caso aquele caia: o endpoint é idempotente e o ciclo tolera atraso
# (NOTIFICATION_GRACE_MINUTES), então um disparo tardio entrega o que ficou para
# trás em vez de perder o aviso. Ver docs/DEPLOY.md.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-notifications
  cancel-in-progress: false

jobs:
  notify:
    name: Disparar ciclo de notificações
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure a variável PRODUCTION_URL e o secret CRON_SECRET."
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/cron/notifications")

          echo "$response"
          echo "$response" >> "$GITHUB_STEP_SUMMARY"
