name: Cron de notificações

# O plano Hobby da Vercel só permite cron uma vez por dia, o que é inútil para
# um aviso de "faltam 15 minutos". O agendador fica aqui, de graça e versionado.
#
# O GitHub não garante pontualidade no `schedule` (pode atrasar em horários de
# pico), mas o endpoint é idempotente e trabalha com uma janela de 15 minutos,
# então um atraso de alguns minutos não perde notificação.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-notifications
  cancel-in-progress: false

jobs:
  notify:
    name: Disparar ciclo de notificações
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure a variável PRODUCTION_URL e o secret CRON_SECRET."
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/cron/notifications")

          echo "$response"
          echo "$response" >> "$GITHUB_STEP_SUMMARY"
