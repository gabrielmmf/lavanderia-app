# As labels abaixo precisam existir no repositório: o Dependabot só aplica
# label já criada, e falha em silêncio se ela não existir. Elas são só
# organização — quem de fato dispensa o changeset é o `ci.yml`, olhando o autor
# do pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "skip-changeset"]
    groups:
      # Atualizações de patch/minor num pull request só, para não gerar ruído.
      minor-e-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Next, React e Prisma sobem de major junto com mudança de código —
      # trate manualmente, com preview e testes.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "skip-changeset"]
